# =============================================================================
# Portainer stack for Automotive — production deployment on home NAS.
# =============================================================================
# Three services share an internal network:
#   - automotive: the Next.js app pulled from ghcr.io
#   - cloudflared: Cloudflare Tunnel daemon, exposes the app to cars.duski.org
#   - watchtower: polls ghcr.io and rolls forward when a new image is published
#
# Only `cloudflared` makes outbound connections to Cloudflare; nothing is
# exposed on the host network. The app talks to the tunnel over the docker
# network as `automotive:3000`.
# =============================================================================

services:
  automotive:
    # Replace <github-username> with your GitHub username/org.
    image: ghcr.io/<github-username>/automotive:latest
    container_name: automotive
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/prod.db"
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_APP_URL: "https://cars.duski.org"
      DISABLE_AUTH: "false"
      NODE_ENV: "production"
    volumes:
      # Persist SQLite DB and uploaded receipts/photos on the NAS filesystem.
      # Adjust the host path to wherever you want the data directory on your NAS.
      - /volume1/docker/automotive/data:/data
    networks:
      - tunnel
    labels:
      # Tell Watchtower to monitor this container.
      com.centurylinklabs.watchtower.enable: "true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # The token from Cloudflare Zero Trust → Networks → Tunnels → <your tunnel>.
    # Set TUNNEL_TOKEN as a stack environment variable in Portainer (do NOT
    # commit the actual token to git).
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - tunnel
    depends_on:
      - automotive

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      # Only update containers we explicitly opt in via the label above.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Check ghcr every 5 minutes.
      WATCHTOWER_POLL_INTERVAL: "300"
      # Clean up old images so the NAS doesn't fill with stale layers.
      WATCHTOWER_CLEANUP: "true"
      # If you want a heads-up when an update happens, set notification env
      # vars per https://containrrr.dev/watchtower/notifications/.
    volumes:
      # Watchtower needs the docker socket to manage containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # If your image is private (ghcr.io repo set to private), drop a
      # docker config.json with a PAT here so Watchtower can pull it.
      # - /volume1/docker/watchtower/config.json:/config.json

networks:
  tunnel:
    driver: bridge
