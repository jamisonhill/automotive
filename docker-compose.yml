# =============================================================================
# Portainer stack for Automotive — production deployment on home NAS.
# =============================================================================
# Two stages, controlled by Compose profiles:
#
#   1. Default (no profile)   — `automotive` + `watchtower` only.
#      App is reachable on the LAN at http://<nas-ip>:3022.
#      Auth disabled by default. Use this for the initial deploy.
#
#   2. Profile `tunnel`       — adds `cloudflared` and assumes you've set
#      DISABLE_AUTH=false plus the CF_ACCESS_* env vars + TUNNEL_TOKEN.
#      Public hostname (garage.duski.org) routes through Cloudflare
#      Access → Tunnel → automotive:3000 over the docker network.
#
# To activate the tunnel later in Portainer, edit the stack and add
# `tunnel` to "Profiles" before redeploying.
# =============================================================================

services:
  automotive:
    image: ghcr.io/jamisonhill/automotive:latest
    container_name: automotive
    restart: unless-stopped
    ports:
      # Host:container. 3022 follows the home-NAS port convention
      # (3010 plantlady, 3020 plantlady2, 3021 fishtank, 3022 us).
      # Safe to leave exposed even after the tunnel goes live — the
      # tunnel can target this same port or hit the container by name.
      - "3022:3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      # Phase 9 session auth — required. Generate with
      # `openssl rand -base64 48` and set in the Portainer stack env.
      # If absent, every signup/login throws and renders an error page.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Anthropic key powers the fuel-pump OCR. Optional; OCR
      # silently fails-soft when missing.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://192.168.0.9:3022}"
      NODE_ENV: "production"
      # 9f: removed DISABLE_AUTH, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD —
      # the middleware no longer reads them after the swap to session
      # cookie auth.
    volumes:
      # SQLite DB and uploaded receipts/photos live here. Pre-create
      # /volume1/docker/automotive/data on the NAS and chown to 1001.
      - /volume1/docker/automotive/data:/data
    networks:
      - tunnel
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Namespaced so it doesn't collide with other cloudflared containers
    # already running on the home NAS (one per stack).
    container_name: cloudflared-automotive
    restart: unless-stopped
    profiles: ["tunnel"]
    # The token from Cloudflare Zero Trust → Networks → Tunnels → <your tunnel>.
    # Set TUNNEL_TOKEN as a stack environment variable in Portainer (do NOT
    # commit the actual token to git).
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks:
      - tunnel
    depends_on:
      - automotive

  watchtower:
    image: containrrr/watchtower:latest
    # Namespaced so it can coexist with other per-stack watchtowers on
    # the home NAS (e.g. watchtower-devotional). Each watchtower only
    # acts on containers it has permission to label-match.
    container_name: watchtower-automotive
    restart: unless-stopped
    environment:
      # Only update containers we explicitly opt in via the label above.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Check ghcr every 5 minutes.
      WATCHTOWER_POLL_INTERVAL: "300"
      # Clean up old images so the NAS doesn't fill with stale layers.
      WATCHTOWER_CLEANUP: "true"
    volumes:
      # Watchtower needs the docker socket to manage containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # If your image is private (ghcr.io repo set to private), drop a
      # docker config.json with a PAT here so Watchtower can pull it.
      # - /volume1/docker/watchtower/config.json:/config.json

networks:
  tunnel:
    driver: bridge
