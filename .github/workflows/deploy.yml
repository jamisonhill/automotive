# =============================================================================
# Build & publish container image to GitHub Container Registry (ghcr.io).
# Watchtower running on the home NAS polls ghcr every ~5 min and auto-updates
# the running container, so a `git push` to main is the entire deploy.
# =============================================================================

name: Build and publish image

on:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab without needing a commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name follows ghcr convention: ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Buildx enables better caching and multi-platform builds.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag with both `latest` (Watchtower watches this) and a short SHA
          # (so you can pin/rollback to a specific commit if needed).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache speeds up incremental builds dramatically.
          cache-from: type=gha
          cache-to: type=gha,mode=max
